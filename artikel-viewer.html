<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memuat...</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #662d17;
      --brand2: #c8791e;
      --ebar: #18181f;
      --ebar2: #22222e;
      --eacc: #7dd3fc;
      --ehover: rgba(255,255,255,.08);
    }

    /* ═══ BASE ═══ */
    html { scroll-behavior: smooth; }
    body { font-family: 'Poppins', sans-serif; background: #ddddd8; color: #1a1a1a; min-height: 100vh; }

    /* ═══ LOADING / ERROR ═══ */
    #viewer-loading { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:14px; color:#999; font-size:13px; }
    .ld-bar { width:180px; height:3px; background:#eee; border-radius:4px; overflow:hidden; }
    .ld-bar-inner { height:100%; width:0%; background:var(--brand); animation:ldgo .9s ease forwards; }
    @keyframes ldgo { to { width:100% } }
    #viewer-error { display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:12px; }
    .back-link { display:inline-flex; align-items:center; gap:6px; background:var(--brand); color:#fff; border:none; padding:9px 20px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; margin-top:8px; }
    #viewer-content { display:none; }

    /* ═══ BACK BUTTON ═══ */
    .btn-back { position:fixed; top:16px; left:14px; width:38px; height:38px; border-radius:50%; background:rgba(0,0,0,.52); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:8500; backdrop-filter:blur(8px); transition:.2s; text-decoration:none; }
    .btn-back:hover { background:rgba(0,0,0,.75); transform:scale(1.07); }
    .btn-back svg { width:18px; height:18px; stroke:#fff; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    body.editor-active .btn-back { top:82px; }

    /* ═══════════════════════════════════════════════
       EDITOR TOOLBAR — two rows, Word-feel
    ═══════════════════════════════════════════════ */
    #editorBar {
      display:none; position:fixed; top:0; left:0; right:0; z-index:9999;
      flex-direction:column; background:var(--ebar);
      box-shadow:0 2px 20px rgba(0,0,0,.6);
      user-select:none;
    }
    #editorBar.on { display:flex; }

    /* Row 1 — title + publish/exit */
    .ebar-r1 { display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid rgba(255,255,255,.06); min-height:44px; }
    .ebar-logo { font-size:11px; font-weight:800; letter-spacing:1px; color:#c8791e; text-transform:uppercase; }
    .ebar-dot { width:4px; height:4px; border-radius:50%; background:#444; }
    .ebar-title { font-size:11px; color:#7dd3fc; font-weight:600; background:#0f172a; padding:2px 10px; border-radius:20px; }
    .ebar-sp { flex:1; }
    .ebar-btn { display:flex; align-items:center; gap:5px; padding:6px 13px; border-radius:6px; border:none; font-size:12px; font-weight:700; cursor:pointer; font-family:'Poppins',sans-serif; transition:.15s; white-space:nowrap; }
    .ebar-btn:active { transform:scale(.96); }
    .ebar-btn.save { background:linear-gradient(135deg,#5a2005,#d4853c); color:#fff; box-shadow:0 2px 12px rgba(160,80,20,.45); }
    .ebar-btn.save:hover { opacity:.88; }
    .ebar-btn.exit { background:rgba(255,255,255,.06); color:#999; border:1px solid rgba(255,255,255,.1); }
    .ebar-btn.exit:hover { background:rgba(255,255,255,.12); color:#fff; }
    .ebar-btn svg { stroke:currentColor; fill:none; stroke-width:2.3; flex-shrink:0; }

    /* Row 2 — formatting */
    .ebar-r2 { display:flex; align-items:center; gap:1px; padding:5px 10px; overflow-x:auto; min-height:38px; }
    .ebar-r2::-webkit-scrollbar { display:none; }

    .f-sep { width:1px; height:18px; background:rgba(255,255,255,.1); margin:0 5px; flex-shrink:0; }

    /* Block-format select */
    .f-select {
      background:rgba(255,255,255,.07); color:#bbb; border:1px solid rgba(255,255,255,.1);
      border-radius:5px; padding:4px 7px; font-size:11px; font-family:'Poppins',sans-serif;
      cursor:pointer; outline:none; flex-shrink:0;
    }
    .f-select:hover { background:rgba(255,255,255,.12); color:#fff; }
    option { background:#18181f; color:#fff; }

    /* Formatting buttons */
    .f-btn {
      display:flex; align-items:center; justify-content:center; gap:3px;
      padding:4px 7px; min-width:28px; border-radius:4px; border:none;
      cursor:pointer; background:none; color:#aaa; font-size:12px; font-weight:700;
      font-family:'Poppins',sans-serif; transition:.12s; flex-shrink:0; white-space:nowrap;
    }
    .f-btn:hover { background:var(--ehover); color:#fff; }
    .f-btn.on { background:rgba(200,121,30,.22); color:#f5b870; }
    .f-btn svg { stroke:currentColor; fill:none; stroke-width:2.2; pointer-events:none; }

    /* Insert foto button — highlighted */
    .f-btn.foto {
      background:rgba(200,121,30,.1); color:#c8791e; border:1px solid rgba(200,121,30,.25);
      padding:4px 10px; font-size:11px; border-radius:5px; gap:5px;
    }
    .f-btn.foto:hover { background:rgba(200,121,30,.22); color:#f5b870; }

    /* ═══════════════════════════════════════════════
       HALAMAN ARTIKEL — clean document look
    ═══════════════════════════════════════════════ */
    body.editor-active { background:#ccc; }

    .art-wrap { padding-top:0; transition:padding .2s; }
    body.editor-active .art-wrap { padding-top:16px; }

    .art-page {
      max-width:860px; margin:0 auto;
      background:#fff; min-height:100vh;
      padding:52px 72px 120px;
      box-shadow:0 0 60px rgba(0,0,0,.15);
      position:relative;
    }
    @media (max-width:900px) { .art-page { padding:44px 36px 90px; } }
    @media (max-width:600px) { .art-page { padding:36px 20px 80px; } }

    /* Panduan margin — garis merah putus saat editor */
    body.editor-active .art-page { outline:none; }
    body.editor-active .art-page::before,
    body.editor-active .art-page::after {
      content:''; position:absolute; top:0; bottom:0; width:1px; pointer-events:none;
      background:repeating-linear-gradient(to bottom,#c8791e44 0,#c8791e44 5px,transparent 5px,transparent 12px);
    }
    body.editor-active .art-page::before { left:72px; }
    body.editor-active .art-page::after  { right:72px; }
    @media (max-width:900px) { body.editor-active .art-page::before { left:36px; } body.editor-active .art-page::after { right:36px; } }
    @media (max-width:600px) { body.editor-active .art-page::before { left:20px; } body.editor-active .art-page::after { right:20px; } }

    /* Margin guide label */
    .margin-guide {
      display:none; position:sticky; top:0; z-index:200;
      background:rgba(200,121,30,.06); border-bottom:1px solid rgba(200,121,30,.15);
      text-align:center; font-size:9px; font-weight:700; letter-spacing:1.2px;
      text-transform:uppercase; color:rgba(200,121,30,.7); padding:4px; pointer-events:none;
    }
    body.editor-active .margin-guide { display:block; }

    /* ── ARTICLE HEADER ── */
    .art-cat-row { font-size:12px; color:#aaa; margin-bottom:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .art-cat { color:#c8791e; font-weight:700; text-transform:uppercase; letter-spacing:.5px; font-size:11px; }
    .art-tgl { color:#bbb; font-size:11px; }

    .art-judul { font-size:clamp(24px,4.5vw,38px); font-weight:800; line-height:1.16; color:#111; margin-bottom:10px; letter-spacing:-.4px; }
    .art-sub { font-size:13px; color:#999; padding-bottom:18px; border-bottom:1px solid #f0f0f0; margin-bottom:24px; }

    /* Editor focus ring on header fields */
    body.editor-active #editJudul:focus,
    body.editor-active #editPenulis:focus,
    body.editor-active #editLead:focus { outline:2px solid rgba(200,121,30,.35); outline-offset:2px; border-radius:3px; }

    /* ── FOTO UTAMA (hero bleed) ── */
    .art-hero-wrap { margin:0 -72px 36px; overflow:hidden; position:relative; }
    @media (max-width:900px) { .art-hero-wrap { margin:0 -36px 28px; } }
    @media (max-width:600px) { .art-hero-wrap { margin:0 -20px 24px; } }
    .art-hero-wrap img { width:100%; display:block; max-height:500px; object-fit:cover; }

    .foto-hero-ctrl {
      display:none; position:absolute; bottom:14px; right:14px; gap:8px;
    }
    body.editor-active .foto-hero-ctrl { display:flex; }
    .foto-hero-btn {
      display:flex; align-items:center; gap:5px;
      background:rgba(0,0,0,.62); color:#fff; border:none;
      padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600;
      cursor:pointer; font-family:'Poppins',sans-serif; backdrop-filter:blur(4px);
      transition:.15s;
    }
    .foto-hero-btn:hover { background:rgba(0,0,0,.85); }
    .foto-hero-btn.del { color:#fca5a5; }

    .foto-empty-hero {
      display:none; margin:0 -72px 36px; height:180px;
      background:#f8f7f5; border:2px dashed #e0d8cc;
      align-items:center; justify-content:center; gap:10px;
      font-size:14px; color:#bbb; font-weight:600; cursor:pointer;
      transition:.15s;
    }
    .foto-empty-hero:hover { background:#f2efe9; border-color:#c8791e; color:#c8791e; }
    body.editor-active .foto-empty-hero { display:flex; }
    @media (max-width:900px) { .foto-empty-hero { margin:0 -36px 28px; } }
    @media (max-width:600px) { .foto-empty-hero { margin:0 -20px 24px; } }

    /* ── LEAD / RINGKASAN ── */
    .art-lead { font-size:16px; font-weight:600; color:#333; line-height:1.72; border-left:4px solid var(--brand); padding-left:18px; margin-bottom:28px; font-style:italic; }

    /* ══════════════════════════════════════════════════
       DOCUMENT CANVAS — single contenteditable region
       Kunci: foto TIDAK contenteditable="false", tapi
       dibungkus figure yang aman diketik di sekitarnya
    ══════════════════════════════════════════════════ */
    #docCanvas {
      font-size:15.5px; line-height:1.9; color:#222;
      outline:none; min-height:280px;
      word-break:break-word; overflow-wrap:break-word;
      caret-color: #c8791e;
    }

    /* Paragraf */
    #docCanvas p { margin-bottom:16px; min-height:1.9em; }
    #docCanvas h2 { font-size:21px; font-weight:700; margin:30px 0 12px; color:#111; line-height:1.3; }
    #docCanvas h3 { font-size:17px; font-weight:600; margin:22px 0 8px; color:#333; line-height:1.4; }
    #docCanvas blockquote { border-left:4px solid var(--brand); padding:10px 18px; margin:22px 0; background:#fffaf5; color:#555; font-style:italic; border-radius:0 6px 6px 0; }
    #docCanvas ul, #docCanvas ol { margin:0 0 16px 26px; }
    #docCanvas li { margin-bottom:6px; }
    #docCanvas hr { border:none; border-top:1px solid #eee; margin:26px 0; }

    /* ── FOTO DALAM CANVAS ──
       Setiap figure punya <p> sentinel sebelum & sesudah.
       Sentinel selalu punya height agar bisa diklik.
    ── */
    body.editor-active #docCanvas p:empty {
      min-height: 1.5em; cursor: text;
    }
    body.editor-active #docCanvas p:empty::before {
      content: "\200B"; display: inline;
    }
    /* Zona klik tepat di bawah foto */
    .fig-click-below {
      display: none; width: 100%; padding: 5px 8px; cursor: text;
      font-size: 10px; color: #c8791e; font-style: italic;
      background: rgba(200,121,30,.05); border-radius: 0 0 6px 6px;
      border: 1px dashed rgba(200,121,30,.25); border-top: none;
      line-height: 1.4;
    }
    body.editor-active figure.doc-fig .fig-click-below { display: block; }

    #docCanvas figure.doc-fig {
      display:block; margin:20px 0; position:relative;
      line-height:0; border-radius:8px; overflow:visible;
    }
    #docCanvas figure.doc-fig figcaption { display:none; }

    /* Foto itu sendiri */
    #docCanvas figure.doc-fig img {
      display:block; border-radius:8px;
      max-width:100%; cursor:default;
      pointer-events:none; /* Biar klik menembus ke figure */
      transition:box-shadow .15s;
    }

    /* Ukuran preset */
    #docCanvas figure.doc-fig.sz-s { max-width:240px; }
    #docCanvas figure.doc-fig.sz-m { max-width:460px; }
    #docCanvas figure.doc-fig.sz-l { max-width:100%; }

    /* Float */
    #docCanvas figure.doc-fig.fl-l { float:left; margin:6px 22px 12px 0; }
    #docCanvas figure.doc-fig.fl-r { float:right; margin:6px 0 12px 22px; }
    #docCanvas figure.doc-fig.fl-c { margin-left:auto; margin-right:auto; display:table; }

    /* Clearfix setelah float */
    #docCanvas .cf { clear:both; display:block; line-height:0; font-size:0; height:0; }

    /* ── FOTO TOOLBAR (muncul saat foto diklik) ── */
    .fig-toolbar {
      display:none; position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
      background:var(--ebar); border-radius:10px; padding:6px 8px;
      box-shadow:0 6px 24px rgba(0,0,0,.45); gap:4px; align-items:center;
      z-index:600; white-space:nowrap; pointer-events:auto;
      border:1px solid rgba(255,255,255,.08);
    }
    figure.doc-fig.selected .fig-toolbar { display:flex; }

    /* Untuk foto di bawah halaman, toolbar muncul di bawah */
    figure.doc-fig.tb-below .fig-toolbar { bottom:auto; top:calc(100% + 8px); }

    .fig-toolbar::after { /* arrow */
      content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
      border:6px solid transparent; border-bottom:none;
      border-top:6px solid var(--ebar);
    }
    figure.doc-fig.tb-below .fig-toolbar::after {
      bottom:auto; top:-6px;
      border-bottom:6px solid var(--ebar); border-top:none;
    }

    .ftb-group { display:flex; gap:2px; align-items:center; }
    .ftb-sep { width:1px; height:16px; background:rgba(255,255,255,.1); margin:0 4px; }
    .ftb-lbl { font-size:9px; font-weight:700; color:#555; letter-spacing:.8px; text-transform:uppercase; padding:0 4px; }

    .ftb-btn {
      display:flex; align-items:center; justify-content:center;
      width:28px; height:26px; border-radius:5px; border:none;
      cursor:pointer; background:none; color:#aaa; font-size:12px; font-weight:700;
      font-family:'Poppins',sans-serif; transition:.12s;
    }
    .ftb-btn:hover { background:var(--ehover); color:#fff; }
    .ftb-btn.on { background:rgba(200,121,30,.25); color:#f5b870; }
    .ftb-btn.danger { color:#f87171; }
    .ftb-btn.danger:hover { background:rgba(127,29,29,.6); color:#fca5a5; }

    /* Focus ring on selected foto */
    figure.doc-fig.selected img { box-shadow:0 0 0 2px #c8791e, 0 0 0 5px rgba(200,121,30,.15); }

    /* ── FOOTER ── */
    .art-divider { border:none; border-top:1px solid #f0f0f0; margin:40px 0 28px; }
    .art-tags { display:flex; flex-wrap:wrap; gap:8px; }
    .art-tag { background:#f5f0ea; color:#7a5535; font-size:12px; padding:5px 14px; border-radius:20px; font-weight:500; }
    .art-footer { background:#3a1800; color:rgba(255,255,255,.6); text-align:center; padding:22px; font-size:12px; letter-spacing:.2px; }

    /* ═══ FAB — foto di kursor ═══ */
    #fabFoto {
      display:none; position:fixed; bottom:22px; right:22px; z-index:9100;
      width:50px; height:50px; border-radius:50%;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      border:none; cursor:pointer; align-items:center; justify-content:center;
      box-shadow:0 4px 20px rgba(102,45,23,.55); transition:.2s;
    }
    #fabFoto:hover { transform:scale(1.09); box-shadow:0 6px 26px rgba(102,45,23,.65); }
    #fabFoto:active { transform:scale(.94); }
    #fabFoto svg { stroke:#fff; fill:none; stroke-width:2; width:21px; height:21px; }
    body.editor-active #fabFoto { display:flex; }

    #fabLabel {
      display:none; position:fixed; bottom:82px; right:22px;
      background:rgba(0,0,0,.76); color:#fff; font-size:10px; font-weight:600;
      padding:5px 10px; border-radius:6px; pointer-events:none; z-index:9101;
      white-space:nowrap; font-family:'Poppins',sans-serif;
    }
    body.editor-active #fabLabel { display:block; }

    /* ═══ TOAST ═══ */
    #toast {
      position:fixed; top:88px; left:50%; transform:translateX(-50%);
      background:#15803d; color:#fff; padding:10px 20px; border-radius:8px;
      font-size:13px; font-weight:600; z-index:10000; opacity:0; transition:opacity .3s;
      pointer-events:none; font-family:'Poppins',sans-serif;
      box-shadow:0 4px 16px rgba(0,0,0,.3); white-space:nowrap;
    }
    #toast.show { opacity:1; }
    #toast.err { background:#991b1b; }

    /* ═══ EDITOR CARET helper ═══ */
    /* Paragraph placeholder biar kelihatan saat kosong */
    body.editor-active #docCanvas p:empty::before {
      content:attr(data-ph);
      color:#ccc; pointer-events:none;
    }
  </style>
</head>
<body>

<!-- BACK BTN -->
<a id="btnBack" href="index.html" class="btn-back" title="Kembali">
  <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<!-- ══ EDITOR TOOLBAR ══ -->
<div id="editorBar">
  <!-- Row 1 -->
  <div class="ebar-r1">
    <span class="ebar-logo">GKR</span>
    <span class="ebar-dot"></span>
    <span class="ebar-title">✏️ Mode Edit</span>
    <div class="ebar-sp"></div>
    <button class="ebar-btn exit" onclick="doExit()">
      <svg viewBox="0 0 24 24" width="12" height="12"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Selesai
    </button>
    <button class="ebar-btn save" onclick="doSave()">
      <svg viewBox="0 0 24 24" width="12" height="12"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload &amp; Tampilkan
    </button>
  </div>

  <!-- Row 2: formatting -->
  <div class="ebar-r2">
    <!-- Block format -->
    <select class="f-select" id="fmtBlock" onchange="applyBlock(this.value)" title="Gaya teks">
      <option value="p">Paragraf</option>
      <option value="h2">Judul Besar</option>
      <option value="h3">Judul Kecil</option>
      <option value="blockquote">Kutipan</option>
    </select>

    <div class="f-sep"></div>

    <!-- Bold / Italic / Underline -->
    <button class="f-btn" id="fB" onmousedown="fmtMD(event,'bold')" title="Bold · Ctrl+B"><b>B</b></button>
    <button class="f-btn" id="fI" onmousedown="fmtMD(event,'italic')" title="Italic · Ctrl+I"><i>I</i></button>
    <button class="f-btn" id="fU" onmousedown="fmtMD(event,'underline')" title="Underline · Ctrl+U" style="text-decoration:underline">U</button>
    <button class="f-btn" id="fS" onmousedown="fmtMD(event,'strikeThrough')" title="Strikethrough"><s>S</s></button>

    <div class="f-sep"></div>

    <!-- Alignment -->
    <button class="f-btn" id="fAL" onmousedown="fmtMD(event,'justifyLeft')" title="Rata kiri">
      <svg viewBox="0 0 18 18" width="14" height="14"><line x1="2" y1="4" x2="16" y2="4"/><line x1="2" y1="8" x2="11" y2="8"/><line x1="2" y1="12" x2="13" y2="12"/><line x1="2" y1="16" x2="16" y2="16"/></svg>
    </button>
    <button class="f-btn" id="fAC" onmousedown="fmtMD(event,'justifyCenter')" title="Tengah">
      <svg viewBox="0 0 18 18" width="14" height="14"><line x1="2" y1="4" x2="16" y2="4"/><line x1="5" y1="8" x2="13" y2="8"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="2" y1="16" x2="16" y2="16"/></svg>
    </button>
    <button class="f-btn" id="fAR" onmousedown="fmtMD(event,'justifyRight')" title="Rata kanan">
      <svg viewBox="0 0 18 18" width="14" height="14"><line x1="2" y1="4" x2="16" y2="4"/><line x1="7" y1="8" x2="16" y2="8"/><line x1="5" y1="12" x2="16" y2="12"/><line x1="2" y1="16" x2="16" y2="16"/></svg>
    </button>
    <button class="f-btn" id="fAJ" onmousedown="fmtMD(event,'justifyFull')" title="Justify">
      <svg viewBox="0 0 18 18" width="14" height="14"><line x1="2" y1="4" x2="16" y2="4"/><line x1="2" y1="8" x2="16" y2="8"/><line x1="2" y1="12" x2="16" y2="12"/><line x1="2" y1="16" x2="16" y2="16"/></svg>
    </button>

    <div class="f-sep"></div>

    <!-- Lists -->
    <button class="f-btn" onmousedown="fmtMD(event,'insertUnorderedList')" title="Bullet list">
      <svg viewBox="0 0 18 18" width="14" height="14"><circle cx="3" cy="5" r="1.5" fill="currentColor" stroke="none"/><line x1="7" y1="5" x2="16" y2="5"/><circle cx="3" cy="9" r="1.5" fill="currentColor" stroke="none"/><line x1="7" y1="9" x2="16" y2="9"/><circle cx="3" cy="13" r="1.5" fill="currentColor" stroke="none"/><line x1="7" y1="13" x2="16" y2="13"/></svg>
    </button>

<!-- CONTENT -->

<script>
/* ═══════════════════════════════════════════════════════════════
   GKR Artikel Viewer v7 — Word-style editor
   KUNCI FIX: foto pakai <figure> yang bisa di-skip kursor dengan
   tombol panah & klik sebelum/sesudah. Setiap figure dikelilingi
   <p> sentinel agar kursor selalu bisa parkir di sekitar foto.
═══════════════════════════════════════════════════════════════ */

const qs       = new URLSearchParams(location.search);
const pageFile = qs.get('page');
const isEdit   = qs.get('mode') === 'edit';

let ST = { judul:'', kat:'', penulis:'', tgl:'', lead:'' };
let mainFoto = null;
let _sel = null;          // saved selection
let _activeFig = null;    // figure currently selected

/* ═══ INIT ═══ */
(function(){
  if (!pageFile) { showErr(); return; }
  try {
    const html = loadPages()[pageFile];
    if (!html) { showErr(); return; }
    const tm = html.match(/<title>(.*?)<\/title>/i);
    if (tm) document.title = tm[1];
    parseAndRender(html);
  } catch(e) { console.error(e); showErr(); }
})();

/* ═══ STORAGE ═══ */
function loadPages() { try { return JSON.parse(localStorage.getItem('gkr_pages')||'{}'); } catch(e) { return {}; } }
function savePage(fn,html) {
  if (tryStore(fn,html)) return true;
  pruneOld(3); if (tryStore(fn,html)) return true;
  const s2 = stripB64(html,25000);
  if (tryStore(fn,s2)) { warnQuota(); return true; }
  pruneOld(8); if (tryStore(fn,s2)) { warnQuota(); return true; }
  warnQuota(); return false;
}
function tryStore(fn,html) {
  try { const p=loadPages(); p[fn]=html; localStorage.setItem('gkr_pages',JSON.stringify(p)); return true; }
  catch(e) { return false; }
}
function pruneOld(n) {
  try {
    const k=JSON.parse(localStorage.getItem('gkr_konten')||'[]'), p=loadPages();
    k.sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(0,n).forEach(d=>{ if(d.pageFile) delete p[d.pageFile]; });
    localStorage.setItem('gkr_pages',JSON.stringify(p));
  } catch(e) {}
}
function stripB64(html,max) { return html.replace(new RegExp('src="data:image/[^;]+;base64,[^"]{'+max+',}"','g'),'src=""'); }
function warnQuota() { toast('⚠️ Penyimpanan hampir penuh — beberapa foto mungkin terpotong', true); }

/* ═══ PARSE & RENDER ═══ */
function parseAndRender(html) {
  const doc = new DOMParser().parseFromString(html,'text/html');

  ST.judul   = tx(doc,'#editJudul')  || tx(doc,'.art-judul') || tx(doc,'h1') || '';
  ST.kat     = tx(doc,'.art-cat')    || tx(doc,'.gen-kat')   || '';
  ST.penulis = tx(doc,'#editPenulis')|| tx(doc,'.art-sub')   || 'Komsos GKR';
  ST.tgl     = tx(doc,'.art-tgl')    || tx(doc,'.gen-date')  || '';
  ST.lead    = tx(doc,'#editLead')   || tx(doc,'.art-lead')  || '';

  // Foto utama
  const fImg = doc.getElementById('fotoUtamaImg') || doc.querySelector('.art-hero-wrap img');
  mainFoto = fImg ? (fImg.getAttribute('src')||null) : null;
  if (mainFoto==='') mainFoto=null;

  // Canvas HTML
  const cvEl = doc.getElementById('docCanvas') || doc.getElementById('isiArtikel') || doc.querySelector('.art-body');
  let cvHTML = cvEl ? cleanHTMLForEdit(cvEl) : '<p>Tulis isi artikel di sini...</p>';
  if (!cvHTML.trim()) cvHTML = '<p>Tulis isi artikel di sini...</p>';

  buildUI(cvHTML);

  document.getElementById('viewer-loading').style.display='none';
  document.getElementById('viewer-content').style.display='block';
  if (isEdit) activateEdit();
}

function tx(doc,sel) { const el=doc.querySelector(sel); return el?el.textContent.trim():''; }

/* Bersihkan HTML dari editor saat parsing */
function cleanHTMLForEdit(el) {
  const cl = el.cloneNode(true);
  cl.querySelectorAll('.fig-toolbar,.img-controls,.foto-overlay,button,input[type=file]').forEach(e=>e.remove());
  cl.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  // Pastikan setiap figure dikelilingi p
  cl.querySelectorAll('figure.doc-fig').forEach(fig => ensurePAround(fig, cl));
  return cl.innerHTML;
}

/* ═══ BUILD UI ═══ */
function buildUI(cvHTML) {
  const { judul, kat, penulis, tgl, lead } = ST;
  document.getElementById('viewer-content').innerHTML = `
    <div class="art-wrap">
      <div class="margin-guide">Panduan margin — teks tidak akan melewati garis ini</div>
      <div class="art-page" id="artPage">

        <div class="art-cat-row">
          <span class="art-cat" id="eKat">${kat||'ARTIKEL'}</span>
          <span class="art-tgl" id="eTgl">${tgl}</span>
        </div>

        <h1 class="art-judul" id="editJudul" contenteditable="false" spellcheck="true">${judul}</h1>
        <div class="art-sub"  id="editPenulis" contenteditable="false">${penulis}</div>

        <!-- Foto utama -->
        ${mainFoto
          ? `<div class="art-hero-wrap" id="artHero">
               <img src="${mainFoto}" alt="${judul}" id="fotoUtamaImg">
               <div class="foto-hero-ctrl">
                 <label class="foto-hero-btn" style="cursor:pointer">
                   <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 11V5a2 2 0 012-2h2l1-1h4l1 1h2a2 2 0 012 2v6a2 2 0 01-2 2H3a2 2 0 01-2-2z"/><circle cx="8" cy="8" r="2"/></svg>
                   Ganti Foto Utama
                   <input type="file" accept="image/*" style="display:none" onchange="onMainFile(this)">
                 </label>
                 <button class="foto-hero-btn del" onclick="delMain()">🗑 Hapus</button>
               </div>
             </div>`
          : `<div class="foto-empty-hero" id="fEmptyHero" onclick="document.getElementById('fInputMain').click()">
               <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5V3h8v2"/></svg>
               Tambah Foto Utama
             </div>
             <div class="art-hero-wrap" id="artHero" style="display:none">
               <img src="" alt="" id="fotoUtamaImg">
               <div class="foto-hero-ctrl">
                 <label class="foto-hero-btn" style="cursor:pointer">
                   <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 11V5a2 2 0 012-2h2l1-1h4l1 1h2a2 2 0 012 2v6a2 2 0 01-2 2H3a2 2 0 01-2-2z"/><circle cx="8" cy="8" r="2"/></svg>
                   Ganti
                   <input type="file" accept="image/*" style="display:none" onchange="onMainFile(this)">
                 </label>
                 <button class="foto-hero-btn del" onclick="delMain()">🗑 Hapus</button>
               </div>
             </div>`
        }
        <input type="file" id="fInputMain" accept="image/*" style="display:none" onchange="onMainFile(this)">

        ${lead ? `<div class="art-lead" id="editLead" contenteditable="false">${lead}</div>` : ''}

        <!-- ══ CANVAS ══ -->
        <div id="docCanvas" contenteditable="false">${cvHTML}</div>

        <hr class="art-divider">
        <div class="art-tags">
          ${kat?`<span class="art-tag">${kat}</span>`:''}<span class="art-tag">Paroki Kristus Raja</span><span class="art-tag">Karawang</span>
        </div>
      </div>
    </div>
    <footer class="art-footer">© 2025 Gereja Katolik Kristus Raja Karawang – Keuskupan Bandung</footer>
  `;
  document.getElementById('btnBack').href = (qs.get('from') || 'index.html');
}

/* ═══ ACTIVATE EDITOR ═══ */
function activateEdit() {
  document.body.classList.add('editor-active');
  document.getElementById('editorBar').classList.add('on');

  // Make editable
  ['editJudul','editPenulis','editLead'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.contentEditable='true';
  });
  const canvas = document.getElementById('docCanvas');
  canvas.contentEditable = 'true';
  canvas.spellcheck = true;

  // Ensure figures have proper sentinel <p>s + click-below zone
  canvas.querySelectorAll('figure.doc-fig').forEach(fig => {
    ensurePAround(fig, canvas);
    attachFigToolbar(fig); // also calls addFigClickBelow
  });
  // Pastikan canvas punya setidaknya satu <p> di akhir untuk ketik
  const lastChild = canvas.lastElementChild;
  if (!lastChild || lastChild.nodeName !== 'P') {
    const p = document.createElement('p'); p.innerHTML = '<br>';
    canvas.appendChild(p);
  }

  // Events
  canvas.addEventListener('keyup',   updateFmtBar);
  canvas.addEventListener('mouseup', updateFmtBar);
  canvas.addEventListener('focus',   updateFmtBar);

  // Click: select figure OR deselect
  canvas.addEventListener('mousedown', onCanvasMouseDown);

  // Click outside canvas → deselect figure
  document.addEventListener('mousedown', onDocMouseDown);

  // Keyboard: arrow past figure
  canvas.addEventListener('keydown', onCanvasKeyDown);
}

/* ═══ FMT BAR STATE ═══ */
function updateFmtBar() {
  try {
    const cmds = ['bold','italic','underline','strikeThrough','justifyLeft','justifyCenter','justifyRight','justifyFull'];
    const ids  = ['fB','fI','fU','fS','fAL','fAC','fAR','fAJ'];
    cmds.forEach((cmd,i)=>{
      const btn=document.getElementById(ids[i]);
      if(btn) btn.classList.toggle('on', document.queryCommandState(cmd));
    });
    const sel=document.getElementById('fmtBlock');
    if(sel){
      const tag=(document.queryCommandValue('formatBlock')||'p').toLowerCase().replace(/^div$/,'p');
      if(['p','h2','h3','blockquote'].includes(tag)) sel.value=tag;
    }
  } catch(e){}
}

/* ═══ SAVE SELECTION ═══ */
function saveSel() {
  const s=window.getSelection();
  if(s&&s.rangeCount) _sel=s.getRangeAt(0).cloneRange();
}
function restoreSel() {
  if(!_sel) return false;
  const s=window.getSelection(); if(!s) return false;
  s.removeAllRanges(); s.addRange(_sel); return true;
}

/* ═══ FMT MOUSEDOWN — prevent focus loss ═══ */
function fmtMD(e, cmd) {
  e.preventDefault(); // Prevents canvas losing focus
  document.execCommand(cmd, false, null);
  updateFmtBar();
}
function applyBlock(tag) {
  document.getElementById('docCanvas').focus();
  document.execCommand('formatBlock', false, '<'+tag+'>');
  updateFmtBar();
}
function insertHRmd(e) {
  e.preventDefault();
  document.execCommand('insertHTML', false, '<hr>');
}

/* ═══ CANVAS MOUSE DOWN ═══ */
function onCanvasMouseDown(e) {
  const fig = e.target.closest('figure.doc-fig');
  if (fig) {
    // Klik pada toolbar di dalam figure — biarkan
    if (e.target.closest('.fig-toolbar')) return;
    e.preventDefault(); // Jangan pindah kursor ke dalam figure
    selectFig(fig);
  } else {
    deselectFig();
  }
}

function onDocMouseDown(e) {
  const canvas = document.getElementById('docCanvas');
  if (canvas && !canvas.contains(e.target) && !e.target.closest('#editorBar')) {
    deselectFig();
  }
}

/* ═══ KEYBOARD NAV AROUND FIGURE ═══ */
function onCanvasKeyDown(e) {
  const canvas = document.getElementById('docCanvas');

  // Delete/Backspace pada figure yang selected
  if (_activeFig && (e.key==='Delete'||e.key==='Backspace')) {
    e.preventDefault();
    const next = _activeFig.nextElementSibling || _activeFig.previousElementSibling;
    deselectFig();
    _activeFig && _activeFig.remove();
    _activeFig = null;
    if (next) placeCursorAt(next, false);
    return;
  }
  // Escape deselect
  if (_activeFig && e.key==='Escape') { e.preventDefault(); deselectFig(); return; }

  // Arrow keys: jika kursor tepat sebelum/sesudah figure, lewati
  if (e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowLeft') {
    const sel=window.getSelection(); if(!sel||!sel.rangeCount) return;
    const range=sel.getRangeAt(0);
    const node=range.endContainer, off=range.endOffset;
    // Cek apakah berikutnya/sebelumnya adalah figure
    if(e.key==='ArrowDown'||e.key==='ArrowRight') {
      // Cari figure sebagai next sibling dari node saat ini
      let next=null;
      if(node.nodeType===3 && off===node.length) next=node.parentNode.nextSibling;
      else if(node.nodeType===1) next=node.childNodes[off];
      if(next&&next.nodeName==='FIGURE'&&next.classList.contains('doc-fig')) {
        e.preventDefault();
        selectFig(next);
        return;
      }
    }
    if(e.key==='ArrowUp'||e.key==='ArrowLeft') {
      let prev=null;
      if(node.nodeType===3 && range.startOffset===0) prev=node.parentNode.previousSibling;
      else if(node.nodeType===1 && range.startOffset>0) prev=node.childNodes[range.startOffset-1];
      if(prev&&prev.nodeName==='FIGURE'&&prev.classList.contains('doc-fig')) {
        e.preventDefault();
        selectFig(prev);
        return;
      }
    }
  }

  // Enter key: pastikan clearfix ada setelah float, dan sentinel ok
  if (e.key === 'Enter') {
    setTimeout(() => {
      canvas.querySelectorAll('figure.doc-fig.fl-l, figure.doc-fig.fl-r').forEach(fig => {
        ensureClearfix(fig);
      });
      // Pastikan setiap figure punya p sesudahnya
      canvas.querySelectorAll('figure.doc-fig').forEach(fig => {
        let after = fig.nextSibling;
        while (after && after.classList && after.classList.contains('cf')) after = after.nextSibling;
        if (!after || after.nodeName !== 'P') {
          const p = document.createElement('p'); p.innerHTML = '<br>';
          const cf = fig.nextSibling;
          if (cf && cf.classList && cf.classList.contains('cf')) {
            canvas.insertBefore(p, cf.nextSibling);
          } else {
            canvas.insertBefore(p, fig.nextSibling);
          }
        }
      });
    }, 20);
  }
}

/* ═══ FIGURE SELECT / DESELECT ═══ */
function selectFig(fig) {
  deselectFig();
  _activeFig = fig;
  fig.classList.add('selected');
  // Check if near bottom for toolbar direction
  const rect = fig.getBoundingClientRect();
  const tbH = document.getElementById('editorBar').offsetHeight || 82;
  fig.classList.toggle('tb-below', rect.top - tbH < 80);
}
function deselectFig() {
  if (_activeFig) { _activeFig.classList.remove('selected'); _activeFig=null; }
}

/* ═══ PLACE CURSOR ═══ */
function placeCursorAt(el, atStart) {
  const range = document.createRange();
  const sel = window.getSelection();
  try {
    if (atStart) range.setStart(el, 0); else range.setStart(el, el.childNodes.length||0);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    if (el.focus) el.focus();
  } catch(e){}
}

/* ═══ ENSURE <p> AROUND FIGURE ═══
   Setiap figure harus punya <p> sebelum dan sesudah
   agar kursor bisa parkir di sana
═══════════════════════════════════ */
function ensurePAround(fig, parent) {
  // SEBELUM: pastikan ada <p> tepat sebelum figure
  const prev = fig.previousSibling;
  if (!prev || prev.nodeName !== 'P') {
    const p = document.createElement('p');
    p.innerHTML = '<br>';
    parent.insertBefore(p, fig);
  } else if (prev.nodeName === 'P' && !prev.innerHTML.trim()) {
    prev.innerHTML = '<br>'; // pastikan tidak kosong total
  }

  // SESUDAH: pastikan ada <p> tepat sesudah figure (bukan clearfix)
  let next = fig.nextSibling;
  // Lewati clearfix
  while (next && next.classList && next.classList.contains('cf')) next = next.nextSibling;
  if (!next || next.nodeName !== 'P') {
    const p = document.createElement('p');
    p.innerHTML = '<br>';
    const cf = fig.nextSibling;
    // Insert setelah clearfix jika ada
    if (cf && cf.classList && cf.classList.contains('cf')) {
      parent.insertBefore(p, cf.nextSibling);
    } else {
      parent.insertBefore(p, fig.nextSibling);
    }
  } else if (next.nodeName === 'P' && !next.innerHTML.trim()) {
    next.innerHTML = '<br>';
  }
}

/* ═══ ATTACH TOOLBAR TO FIGURE ═══ */
function attachFigToolbar(fig) {
  if (fig.querySelector('.fig-toolbar')) return; // sudah ada
  const src = fig.querySelector('img') ? fig.querySelector('img').src : '';
  const tb = document.createElement('div');
  tb.className = 'fig-toolbar';
  tb.contentEditable = 'false';
  tb.innerHTML = `
    <div class="ftb-group">
      <span class="ftb-lbl">Ukuran</span>
      <button class="ftb-btn" onclick="figSz(this,'sz-s')" title="Kecil">S</button>
      <button class="ftb-btn" onclick="figSz(this,'sz-m')" title="Sedang">M</button>
      <button class="ftb-btn" onclick="figSz(this,'sz-l')" title="Penuh">L</button>
    </div>
    <div class="ftb-sep"></div>
    <div class="ftb-group">
      <span class="ftb-lbl">Posisi</span>
      <button class="ftb-btn" onclick="figFl(this,'fl-l')" title="Float kiri">←</button>
      <button class="ftb-btn" onclick="figFl(this,'fl-c')" title="Tengah">▪</button>
      <button class="ftb-btn" onclick="figFl(this,'fl-r')" title="Float kanan">→</button>
    </div>
    <div class="ftb-sep"></div>
    <div class="ftb-group">
      <button class="ftb-btn" onclick="figGanti(this)" title="Ganti foto">🔄</button>
      <button class="ftb-btn danger" onclick="figDel(this)" title="Hapus foto">✕</button>
    </div>`;
  fig.appendChild(tb);

  // Klik toolbar tidak boleh deselect
  tb.addEventListener('mousedown', e => e.stopPropagation());

  // Tambah fig-click-below jika belum ada
  addFigClickBelow(fig);
}

/* ═══ FIGURE CONTROLS ═══ */
function figSz(btn, cls) {
  const fig=btn.closest('figure.doc-fig');
  ['sz-s','sz-m','sz-l'].forEach(c=>fig.classList.remove(c));
  fig.classList.add(cls);
  // Clear float jika full-width
  if(cls==='sz-l') { ['fl-l','fl-r'].forEach(c=>fig.classList.remove(c)); fig.classList.add('fl-c'); }
  // Update button states
  btn.closest('.ftb-group').querySelectorAll('.ftb-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function figFl(btn, cls) {
  const fig=btn.closest('figure.doc-fig');
  ['fl-l','fl-r','fl-c'].forEach(c=>fig.classList.remove(c));
  fig.classList.add(cls);
  const canvas=document.getElementById('docCanvas');
  if(cls==='fl-l'||cls==='fl-r') ensureClearfix(fig); else removeClearfix(fig);
  btn.closest('.ftb-group').querySelectorAll('.ftb-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function figGanti(btn) {
  const fig=btn.closest('figure.doc-fig');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    if(!inp.files[0]) return;
    compress(inp.files[0],src=>{ const img=fig.querySelector('img'); if(img) img.src=src; });
  };
  inp.click();
}
function figDel(btn) {
  const fig = btn.closest('figure.doc-fig');
  const parent = fig.parentNode;
  // Cari p setelah figure (lewati clearfix)
  let after = fig.nextSibling;
  while (after && after.classList && after.classList.contains('cf')) after = after.nextSibling;
  // Hapus clearfix juga
  const cf = fig.nextSibling;
  if (cf && cf.classList && cf.classList.contains('cf')) cf.remove();
  deselectFig();
  fig.remove();
  // Pastikan ada p sesudah
  if (!after || after.nodeName !== 'P') {
    const p = document.createElement('p'); p.innerHTML = '<br>';
    // Append atau insert di posisi yang tepat
    parent.appendChild(p);
    placeCursorAt(p, true);
  } else {
    placeCursorAt(after, true);
  }
}

/* ═══ INSERT FOTO DI KURSOR ═══ */
function pickFoto() {
  const inp=document.getElementById('hiddenFile');
  inp.value=''; inp.click();
}

function onFotoFiles(input) {
  if(!input.files||!input.files.length) return;
  const canvas=document.getElementById('docCanvas');
  const files=Array.from(input.files);

  // Process satu per satu, sequential
  let chain = Promise.resolve();
  files.forEach(file=>{
    chain=chain.then(()=>new Promise(resolve=>{
      compress(file,src=>{
        const fig=makeFig(src);
        insertFig(fig, canvas);
        resolve();
      });
    }));
  });
}

function makeFig(src) {
  const fig=document.createElement('figure');
  fig.className='doc-fig sz-l fl-c';
  const img=document.createElement('img'); img.src=src; img.alt='';
  fig.appendChild(img);
  attachFigToolbar(fig);
  return fig;
}

function insertFig(fig, canvas) {
  let inserted = false;

  // Coba sisipkan di posisi kursor tersimpan
  if (_sel) {
    try {
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(_sel);
      const range = sel.getRangeAt(0);

      // Temukan block-level ancestor langsung di bawah canvas
      let node = range.endContainer;
      while (node && node !== canvas && node.parentNode !== canvas) node = node.parentNode;

      if (node && node !== canvas) {
        // Sentinel sebelum
        const pBefore = document.createElement('p'); pBefore.innerHTML = '<br>';
        // Sentinel setelah
        const pAfter = document.createElement('p'); pAfter.innerHTML = '<br>';

        // Jika node adalah p kosong, ganti dengan sentinel sebelum
        if (node.nodeName === 'P' && (!node.textContent.trim() || node.innerHTML === '<br>')) {
          canvas.insertBefore(pAfter, node.nextSibling);
          canvas.insertBefore(fig, node);
          canvas.insertBefore(pBefore, fig);
          node.remove();
        } else {
          // Insert SETELAH node yang ada
          canvas.insertBefore(pAfter, node.nextSibling);
          canvas.insertBefore(fig, pAfter);
          canvas.insertBefore(pBefore, fig);
        }

        // Tambahkan fig-click-below jika belum ada
        addFigClickBelow(fig);
        // Pindahkan kursor ke p setelah foto
        placeCursorAt(pAfter, true);
        _sel = null;
        inserted = true;
      }
    } catch(e) { console.warn('insertFig sel error', e); }
  }

  if (!inserted) {
    // Fallback: append di akhir canvas
    const pBefore = document.createElement('p'); pBefore.innerHTML = '<br>';
    const pAfter = document.createElement('p'); pAfter.innerHTML = '<br>';
    canvas.appendChild(pBefore);
    canvas.appendChild(fig);
    canvas.appendChild(pAfter);
    addFigClickBelow(fig);
    placeCursorAt(pAfter, true);
  }
}

/* Tambahkan zona klik di bawah foto */
function addFigClickBelow(fig) {
  if (fig.querySelector('.fig-click-below')) return;
  const zone = document.createElement('div');
  zone.className = 'fig-click-below';
  zone.contentEditable = 'false';
  zone.textContent = '↵ Klik di sini untuk menulis di bawah foto';
  zone.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    // Cari atau buat <p> tepat setelah figure (atau setelah clearfix)
    let after = fig.nextSibling;
    while (after && after.classList && after.classList.contains('cf')) after = after.nextSibling;
    if (!after || after.nodeName !== 'P') {
      const p = document.createElement('p'); p.innerHTML = '<br>';
      const cf = fig.nextSibling;
      if (cf && cf.classList && cf.classList.contains('cf')) {
        fig.parentNode.insertBefore(p, cf.nextSibling);
      } else {
        fig.parentNode.insertBefore(p, fig.nextSibling);
      }
      after = p;
    }
    placeCursorAt(after, true);
    after.focus && after.focus();
    document.getElementById('docCanvas').focus();
  });
  fig.appendChild(zone);
}

/* ═══ CLEARFIX ═══ */
function ensureClearfix(fig) {
  let next=fig.nextSibling;
  if(!next||(next.classList&&!next.classList.contains('cf')&&next.nodeName!=='P')) {
    const cf=document.createElement('div'); cf.className='cf'; fig.parentNode.insertBefore(cf, next);
  }
}
function removeClearfix(fig) {
  const next=fig.nextSibling;
  if(next&&next.classList&&next.classList.contains('cf')) next.remove();
}

/* ═══ FOTO UTAMA (hero) ═══ */
function onMainFile(input) {
  if(!input.files[0]) return;
  compress(input.files[0],src=>{
    mainFoto=src;
    let hero=document.getElementById('artHero');
    const empty=document.getElementById('fEmptyHero');
    const img=document.getElementById('fotoUtamaImg');
    if(hero){ hero.style.display='block'; } if(img) img.src=src;
    if(empty) empty.style.display='none';
  });
}
function delMain() {
  mainFoto=null;
  const hero=document.getElementById('artHero'),empty=document.getElementById('fEmptyHero'),img=document.getElementById('fotoUtamaImg');
  if(hero) hero.style.display='none'; if(img) img.src=''; if(empty) empty.style.display='flex';
}

/* ═══ SAVE & PUBLISH ═══ */
function doSave() {
  const judul   = (document.getElementById('editJudul')||{}).textContent?.trim() || '';
  const penulis = (document.getElementById('editPenulis')||{}).textContent?.trim() || '';
  const lead    = (document.getElementById('editLead')||{}).textContent?.trim() || '';
  const kat     = (document.getElementById('eKat')||{}).textContent?.trim() || ST.kat;
  const tgl     = (document.getElementById('eTgl')||{}).textContent?.trim() || ST.tgl;

  // Snapshot canvas bersih
  const canvas=document.getElementById('docCanvas');
  let cvHTML='';
  if(canvas){
    deselectFig();
    const cl=canvas.cloneNode(true);
    cl.querySelectorAll('.fig-toolbar').forEach(el=>el.remove());
    cl.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
    cl.querySelectorAll('figure.doc-fig').forEach(f=>f.classList.remove('selected','tb-below'));
    // Hapus p kosong berlebih (sentinel ganda)
    let pEls=cl.querySelectorAll('p'); pEls.forEach(p=>{ if(p.innerHTML==='<br>'&&!p.textContent.trim()&&p.previousSibling?.nodeName==='P'&&p.nextSibling?.nodeName==='FIGURE') {} });
    cvHTML=cl.innerHTML;
  }

  const fUtama=mainFoto||'';
  const pubHTML=makePubHTML({judul,penulis,lead,kat,tgl,cvHTML,fUtama});
  const ok=savePage(pageFile,pubHTML);
  syncKonten(judul,lead,penulis);
  toast(ok?'✅ Dipublish! Langsung bisa diakses umum.':'⚠️ Tersimpan (foto mungkin terpotong)', !ok);
}

function doExit() {
  doSave();
  setTimeout(()=>{
    try { const u=new URL(location.href); u.searchParams.delete('mode'); history.replaceState({},'',u.toString()); } catch(e){}
    document.body.classList.remove('editor-active');
    document.getElementById('editorBar').classList.remove('on');
    ['editJudul','editPenulis','editLead'].forEach(id=>{ const el=document.getElementById(id); if(el) el.contentEditable='false'; });
    const canvas=document.getElementById('docCanvas'); if(canvas) canvas.contentEditable='false';
    document.querySelectorAll('figure.doc-fig').forEach(f=>f.classList.remove('selected','tb-below'));
    document.querySelectorAll('.fig-toolbar').forEach(el=>el.style.display='none');
  },1500);
}

/* ═══ SYNC KONTEN ═══ */
function syncKonten(judul,lead,penulis) {
  try {
    const k=JSON.parse(localStorage.getItem('gkr_konten')||'[]');
    const i=k.findIndex(d=>d.pageFile===pageFile);
    if(i>=0){ k[i].judul=judul; k[i].ringkasan=lead; k[i].penulis=penulis; if(mainFoto) k[i].fotos=[mainFoto,...(k[i].fotos||[]).slice(1)]; localStorage.setItem('gkr_konten',JSON.stringify(k)); }
  } catch(e){}
}

/* ═══ COMPRESS ═══ */
function compress(file,cb) {
  const r=new FileReader(); r.onload=e=>{ const img=new Image(); img.onload=()=>{
    const MAX=1280; let w=img.width,h=img.height;
    if(w>MAX||h>MAX){ if(w>=h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',0.82));
  }; img.src=e.target.result; }; r.readAsDataURL(file);
}

/* ═══ TOAST / ERROR ═══ */
function toast(msg,isErr=false) {
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.remove('show','err');
  if(isErr) t.classList.add('err');
  void t.offsetWidth; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),4000);
}
function showErr() { document.getElementById('viewer-loading').style.display='none'; document.getElementById('viewer-error').style.display='flex'; }
</script>
