<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memuat Artikel...</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f6f7fb}
    #viewer-wrap{min-height:100vh}
    /* Loading sederhana */
    #viewer-loading{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:60vh;gap:12px;color:#888;font-size:15px;
    }
    .ld-bar{
      width:180px;height:4px;background:#eee;border-radius:4px;overflow:hidden;
    }
    .ld-bar-inner{
      height:100%;width:0%;background:#662d17;border-radius:4px;
      animation:ldanim 0.6s ease forwards;
    }
    @keyframes ldanim{to{width:100%}}
    /* Error */
    #viewer-error{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px;color:#888;font-size:15px}
    .back-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#662d17;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
  </style>
</head>
<body>
<div id="viewer-wrap">
  <div id="viewer-loading">
    <div class="ld-bar"><div class="ld-bar-inner"></div></div>
    <span>Memuat artikel...</span>
  </div>
  <div id="viewer-error">
    <span>Artikel tidak ditemukan.</span>
    <a href="index.html" class="back-btn">← Kembali</a>
  </div>
  <div id="viewer-content"></div>
</div>

<script>
  (function() {
    const params   = new URLSearchParams(window.location.search);
    const pageFile = params.get('page');

    if (!pageFile) { showError(); return; }

    try {
      const pages = JSON.parse(localStorage.getItem('gkr_pages') || '{}');
      const html  = pages[pageFile];
      if (!html) { showError(); return; }

      // Ambil <title>
      const titleMatch = html.match(/<title>(.*?)<\/title>/i);
      if (titleMatch) document.title = titleMatch[1];

      // Render langsung ke halaman — ganti seluruh body dengan konten artikel
      document.open();
      document.write(html);
      document.close();

    } catch(e) {
      showError();
    }

    function showError() {
      document.getElementById('viewer-loading').style.display = 'none';
      document.getElementById('viewer-error').style.display  = 'flex';
    }
  })();
</script>
</body>
</html>
